[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "production-agentic-rag-platform"
version = "1.0.0"
description = "Production-oriented Agentic RAG reference platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "Ashok Kumar Manohar"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "langchain-core>=0.3,<1",
  "langgraph>=0.2,<1",
  "httpx>=0.27,<1",
  "redis>=5,<6",
  "opensearch-py>=2.7,<3",
  "python-multipart>=0.0.12,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
