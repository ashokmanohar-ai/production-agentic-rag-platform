name: Live RAG Smoke

on:
  workflow_dispatch:
    inputs:
      ollama_url:
        description: Ollama endpoint reachable from the runner
        required: true
        default: http://localhost:11434
      default_model:
        description: Installed Ollama generation model
        required: true
        default: llama3.2:3b
      embedding_model:
        description: Installed Ollama embedding model
        required: true
        default: nomic-embed-text
      embedding_dimensions:
        description: Embedding vector dimensions
        required: true
        default: "768"

jobs:
  live-rag-smoke:
    runs-on: self-hosted
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      OPENSEARCH_URL: http://localhost:9200
      OLLAMA_URL: ${{ inputs.ollama_url }}
      DEFAULT_MODEL: ${{ inputs.default_model }}
      EMBEDDING_MODEL: ${{ inputs.embedding_model }}
      EMBEDDING_DIMENSIONS: ${{ inputs.embedding_dimensions }}
      CACHE_ENABLED: "false"
      LANGFUSE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verify runtime and installed models
        run: python scripts/runtime_check.py
      - name: Run live Ollama RAG smoke
        run: python scripts/live_rag_smoke.py --json
